<!-- Connection Status Component - Right-aligned with Vertically Aligned LEDs -->
<div class="flex justify-end">
    <div class="grid grid-cols-[12px_1fr] gap-x-1 sm:gap-x-2 gap-y-1 justify-items-start items-center w-32 sm:w-40 lg:w-44">
        <!-- Backend Connection LED -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.connection?.statusColor || 'bg-gray-500'"
             :title="$store.connection?.lastUpdate || 'Indlæser...'" x-cloak></div>
        <!-- Backend Connection Text -->
        <span x-text="$store.connection?.text || 'Backend: Online'" class="text-xs truncate text-right max-w-full" x-cloak></span>

        <!-- Just In Engine Connection LED -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.ingest ? $store.ingest.getConnectionStatusColor() : 'bg-gray-500'"
             :title="$store.ingest ? 'Just In Engine forbindelse' : 'Loading...'" x-cloak></div>
        <!-- Just In Engine Connection Text -->
        <span x-text="$store.ingest ? $store.ingest.getConnectionStatusText() : 'Just In Engine: Loading...'" class="text-xs truncate text-right max-w-full" x-cloak></span>

        <!-- Tally Switch LED -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.tallySwitch ? $store.tallySwitch.getStatusColor() : 'bg-gray-500'"
             :title="$store.tallySwitch ? $store.tallySwitch.getStatusTooltip() : 'Loading...'" x-cloak></div>
        <!-- Tally Switch Text -->
        <span x-text="$store.tallySwitch ? $store.tallySwitch.getIndicatorText() : 'Tally Switch'" class="text-xs truncate text-right max-w-full" x-cloak></span>
    </div>
</div>
