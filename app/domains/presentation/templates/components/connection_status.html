<!-- Connection Status Component - Right-aligned, 2 per row -->
<div class="flex justify-end">
    <div class="grid grid-cols-[12px_1fr_12px_1fr] gap-x-1 sm:gap-x-2 gap-y-1 items-center">
        <!-- Row 1: Backend + Just In Engine -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.connection?.statusColor || 'bg-gray-500'"
             :title="$store.connection?.lastUpdate || 'Indlæser...'" x-cloak></div>
        <span x-text="$store.connection?.text || 'Backend: Online'" class="text-xs truncate" x-cloak></span>

        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             x-show="$store.settings?.editForm?.justin_integration_enabled !== false"
             :class="$store.ingest ? $store.ingest.getConnectionStatusColor() : 'bg-gray-500'"
             :title="$store.ingest ? 'Just In Engine forbindelse' : 'Loading...'" x-cloak></div>
        <span x-show="$store.settings?.editForm?.justin_integration_enabled !== false"
              x-text="$store.ingest ? $store.ingest.getConnectionStatusText() : 'Just In Engine: Loading...'" class="text-xs truncate" x-cloak></span>

        <!-- Row 2: Tally (hidden if not configured) + Scanner -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             x-show="$store.tallySwitch && $store.tallySwitch.ipAddress && $store.tallySwitch.ipAddress !== '' && $store.tallySwitch.ipAddress !== 'unknown'"
             :class="$store.tallySwitch ? $store.tallySwitch.getStatusColor() : 'bg-gray-500'"
             :title="$store.tallySwitch ? $store.tallySwitch.getStatusTooltip() : 'Loading...'" x-cloak></div>
        <span x-show="$store.tallySwitch && $store.tallySwitch.ipAddress && $store.tallySwitch.ipAddress !== '' && $store.tallySwitch.ipAddress !== 'unknown'"
              x-text="$store.tallySwitch ? $store.tallySwitch.getIndicatorText() : 'Tally Switch'" class="text-xs truncate" x-cloak></span>

        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.ui?.scanner?.scanning ? 'bg-green-500' : ($store.ui?.scanner?.paused ? 'bg-orange-500' : 'bg-gray-500')" x-cloak></div>
        <span class="text-xs truncate" x-cloak>
            <span x-show="$store.ui?.scanner?.scanning">Scanner Active</span>
            <span x-show="$store.ui?.scanner?.paused">Scanner Paused</span>
            <span x-show="!$store.ui?.scanner?.scanning && !$store.ui?.scanner?.paused">Scanner Unknown</span>
        </span>
    </div>
</div>
