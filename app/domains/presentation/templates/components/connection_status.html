<!-- Connection Status Component - Right-aligned with Vertically Aligned LEDs -->
<div class="flex justify-end">
    <div class="grid grid-cols-[12px_1fr] gap-x-2 gap-y-1 justify-items-start items-center w-32">
        <!-- Server Connection LED -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.connection?.statusColor || 'bg-gray-500'"
             :title="$store.connection?.lastUpdate || 'Indlæser...'"></div>
        <!-- Server Connection Text -->
        <span x-text="$store.connection?.text || 'Backend: Online'" class="text-xs whitespace-nowrap text-right"></span>

        <!-- Tally Switch LED -->
        <div class="status-indicator rounded-full w-3 h-3 justify-self-center"
             :class="$store.tallySwitch ? $store.tallySwitch.getStatusColor() : 'bg-gray-500'"
             :title="$store.tallySwitch ? $store.tallySwitch.getStatusTooltip() : 'Loading...'"></div>
        <!-- Tally Switch Text -->
        <span x-text="$store.tallySwitch ? $store.tallySwitch.getIndicatorText() : 'Tally Switch'" class="text-xs whitespace-nowrap text-right"></span>
    </div>
</div>
