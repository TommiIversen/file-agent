<!-- Just In Engine Status Bar Component (Compact Design) -->
<div class="bg-gray-700/60 rounded-lg p-3 mb-4" x-data="{ showDetails: false, showPaths: false }" x-cloak>
    <!-- Compact Status Bar -->
    <div class="flex items-center">
        <!-- Left side: Channel LEDs -->
        <div class="flex-1 flex items-center space-x-1">
            <span class="text-sm font-medium text-gray-300 mr-3"><i data-lucide="video" class="inline-block w-4 h-4"></i> Channels:</span>
            <template x-for="channel in $store.ingest?.getChannelsSorted() || []" :key="channel.name">
                <div class="relative group">
                    <!-- LED Indicator -->
                    <div class="w-6 h-6 rounded-full border-2 border-gray-600 transition-all duration-200 group-hover:animate-none relative"
                         :class="{
                             'bg-red-500 border-red-500 shadow-lg shadow-red-400/50': channel.is_recording,
                             'bg-gray-500 border-gray-400': !channel.is_recording && channel.has_signal,
                             'bg-red-800 border-red-600': !channel.has_signal
                         }">
                        <!-- Error indicator overlay -->
                        <div x-show="channel.has_errors" 
                             class="absolute inset-0 flex items-center justify-center text-yellow-500 text-2xl font-black animate-pulse"
                             style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 2px rgba(0, 0, 0, 0.9);">
                            !
                        </div>
                    </div>
                    <!-- Simple Channel Name Label (shows on hover) -->
                    <div class="absolute bottom-6 left-1/2  transform-translate-x-1/2 bg-black/90 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10"
                         :class="channel.has_errors && channel.last_error ? 'whitespace-normal' : 'whitespace-nowrap  min-w-xs max-w-sm'">
                        <div x-text="channel.name" class="font-medium" x-cloak></div>
                        <div class="text-gray-300 text-xs">
                            <span x-text="channel.is_recording ? '🔴 REC' : '⚫ Standby'" x-cloak></span>
                            <span x-show="!channel.has_signal" class="text-red-400"> • No Signal</span>
                            <span x-show="channel.has_errors" class="text-yellow-400"> • Errors</span>
                        </div>
                        <!-- Error details shown directly under status -->
                        <div x-show="channel.has_errors" class="text-yellow-300 text-xs mt-1 border-t border-gray-600 pt-1">                                    
                            <!-- Show ALL errors from last_errors array if available -->
                            <template x-if="channel.last_errors && channel.last_errors.length > 0">
                                <div>
                                    <div class="text-gray-400 text-xs mb-1">
                                        <span x-text="channel.last_errors.length" x-cloak></span> error(s):
                                    </div>
                                    <template x-for="(error, index) in channel.last_errors" :key="index">
                                        <div class="mb-2 last:mb-0">
                                            <div x-text="`${index + 1}. ${error?.errorUIDescription || 'Unknown error'}`" class="max-w-xs whitespace-normal" x-cloak></div>
                                            <div x-show="error?.date" class="text-gray-400 text-xs">
                                                <span x-text="error?.date ? new Date(error.date * 1000).toLocaleDateString('da-DK', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : ''" x-cloak></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                            <!-- Fallback to channel.last_error if available -->
                            <template x-if="!channel.last_errors || channel.last_errors.length === 0">
                                <div x-show="channel.last_error">
                                    <div x-text="channel.last_error?.error_message || 'Unknown error'" class="max-w-xs whitespace-normal" x-cloak></div>
                                    <div x-show="channel.last_error?.timestamp" class="text-gray-400 text-xs">
                                        <span x-text="channel.last_error?.timestamp ? new Date(channel.last_error.timestamp).toLocaleDateString('da-DK', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : ''" x-cloak></span>
                                    </div>
                                </div>
                            </template>
                            
                            <!-- Show if no error data found -->
                            <template x-if="(!channel.last_errors || channel.last_errors.length === 0) && !channel.last_error">
                                <div class="text-red-300">No error details available</div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
            <!-- No channels message -->
            <span x-show="($store.ingest?.getChannelsSorted() || []).length === 0" 
                  class="text-gray-400 text-sm">
                <template x-if="$store.ingest?.isConnected">
                    <span>No channels detected</span>
                </template>
                <template x-if="!$store.ingest?.isConnected">
                    <span class="text-red-400">🔴 Just In Engine offline</span>
                </template>
            </span>
        </div>

        <!-- Center: Record Time Display -->
        <div class="flex-shrink-0 flex justify-center">
            <div class="relative">
                <!-- Recording Timer Display -->
                <div class="flex items-center space-x-2 bg-gray-800/80 rounded-lg px-3 py-1">
                    <span class="text-lg text-gray-400">REC:</span>
                    <div class="flex items-center space-x-1">
                        <!-- Recording indicator dot (yellow when auto-stop warning active) -->
                        <div class="w-2 h-2 rounded-full transition-all duration-200"
                             :class="{
                                 'bg-yellow-400 animate-pulse shadow-lg shadow-yellow-400/50': $store.ingest?.autoStop?.warningSent && !$store.ingest?.autoStop?.triggered && $store.ingest?.recordingTimer?.isRunning,
                                 'bg-red-500 animate-pulse shadow-lg shadow-red-500/50': $store.ingest?.recordingTimer?.isRunning && $store.ingest?.isConnected && !($store.ingest?.autoStop?.warningSent && !$store.ingest?.autoStop?.triggered),
                                 'bg-gray-500': !$store.ingest?.recordingTimer?.isRunning || !$store.ingest?.isConnected
                             }"></div>

                        <!-- AUTO-STOP MODE: Big countdown replaces wall-clock timecode -->
                        <template x-if="$store.ingest?.autoStop?.enabled && $store.ingest?.recordingTimer?.isRunning">
                            <span class="font-mono text-2xl font-medium transition-all duration-200"
                                  :class="{
                                      'text-red-400 animate-pulse font-bold': $store.ingest?.autoStop?.triggered,
                                      'text-yellow-400 animate-pulse': $store.ingest?.autoStop?.warningSent && !$store.ingest?.autoStop?.triggered,
                                      'text-red-400': !$store.ingest?.autoStop?.warningSent && !$store.ingest?.autoStop?.triggered,
                                  }"
                                  x-text="$store.ingest?.countdownDisplayTime || '00:00:00:00'" x-cloak></span>
                        </template>

                        <!-- NORMAL MODE: Wall-clock timecode (when auto-stop not enabled or not recording) -->
                        <template x-if="!($store.ingest?.autoStop?.enabled && $store.ingest?.recordingTimer?.isRunning)">
                            <span class="font-mono text-2xl font-medium"
                                  :class="$store.ingest?.recordingTimer?.isRunning && $store.ingest?.isConnected ? 'text-red-400' : 'text-gray-400'"
                                  x-text="$store.ingest?.recordingTimer?.displayTime || '00:00:00:00'" x-cloak></span>
                        </template>
                    </div>

                    <!-- Auto-stop limit label (shown in auto-stop mode while recording) -->
                    <template x-if="$store.ingest?.autoStop?.enabled && $store.ingest?.recordingTimer?.isRunning">
                        <div class="flex items-center ml-2 pl-2 border-l border-gray-600">
                            <span class="text-xs"
                                  :class="$store.ingest?.autoStop?.warningSent ? 'text-yellow-400' : 'text-gray-500'"><i data-lucide="timer" class="inline-block w-3 h-3"></i></span>
                            <span class="text-xs text-gray-500 ml-1"
                                  x-text="'/ ' + ($store.ingest?.formatLimit($store.ingest?.autoStop?.limitSeconds || 0))" x-cloak></span>
                        </div>
                    </template>
                </div>
                <!-- OFFLINE Overlay -->
                <div x-show="!$store.ingest?.isConnected" 
                     class="absolute inset-0 flex items-center justify-center rounded-lg backdrop-blur-sm">
                    <span class="text-red-400 font-bold text-sm px-2 py-1 bg-red-900/50 rounded border border-red-400">
                        OFFLINE
                    </span>
                </div>
            </div>
        </div>

        <!-- Right side: Tally Status & Details Toggle -->
        <div class="flex-1 flex items-center justify-end space-x-3">
            <!-- Recording Summary -->
            <div class="text-xs text-gray-300">
                <span x-text="($store.ingest?.getChannelsSorted() || []).filter(c => c.is_recording).length" x-cloak></span>/<span x-text="($store.ingest?.getChannelsSorted() || []).length" x-cloak></span> rec
            </div>

            <!-- Tally Light Status -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-gray-400">Tally:</span>
                <template x-if="$store.ingest?.getRecordingStatus() === 'none'">
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-gray-500 rounded-full"></div>
                        <span class="text-xs text-gray-300 ml-1">OFF</span>
                    </div>
                </template>
                <template x-if="$store.ingest?.getRecordingStatus() === 'all'">
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-red-500 rounded-full shadow-lg shadow-red-500/50"></div>
                        <span class="text-xs text-red-300 ml-1">ON</span>
                    </div>
                </template>
                <template x-if="$store.ingest?.getRecordingStatus() === 'some'">
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-red-400 rounded-full animate-pulse shadow-lg shadow-red-400/50"></div>
                        <span class="text-xs text-red-300 ml-1">BLINK</span>
                    </div>
                </template>
                <template x-if="$store.ingest?.getRecordingStatus() === 'blink'">
                    <div class="flex items-center">
                        <div class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse shadow-lg shadow-yellow-400/50"></div>
                        <span class="text-xs text-yellow-300 ml-1">BLINK <i data-lucide="timer" class="inline-block w-3 h-3"></i></span>
                    </div>
                </template>
            </div>

            <!-- Details Toggle Button -->
            <button @click="showDetails = !showDetails"
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded hover:bg-gray-600 transition-all duration-200">
                <span x-text="showDetails ? '▲ Hide' : '▼ Details'" x-cloak></span>
            </button>
        </div>
    </div>

    <!-- Detailed View (Expandable) -->
    <div x-show="showDetails" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 max-h-0"
         x-transition:enter-end="opacity-100 max-h-96"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 max-h-96"
         x-transition:leave-end="opacity-0 max-h-0"
         class="mt-4 pt-4 border-t border-gray-600 overflow-hidden">
        
        <!-- Statistics Row -->
        <div class="flex items-center space-x-3 mb-4">
            <div class="flex-1 bg-gray-800 rounded-lg p-3 text-center">
                <div class="text-lg font-bold text-white" x-text="$store.ingest?.statistics?.totalChannels || 0" x-cloak></div>
                <div class="text-xs text-gray-300">Total</div>
            </div>
            <div class="flex-1 bg-gray-800 rounded-lg p-3 text-center">
                <div class="text-lg font-bold text-red-400" x-text="$store.ingest?.statistics?.recordingChannels || 0" x-cloak></div>
                <div class="text-xs text-gray-300">Recording</div>
            </div>
            <div class="flex-1 bg-gray-800 rounded-lg p-3 text-center">
                <div class="text-lg font-bold text-yellow-400" x-text="$store.ingest?.statistics?.errorChannels || 0" x-cloak></div>
                <div class="text-xs text-gray-300">Errors</div>
            </div>
            <div class="flex-1 bg-gray-800 rounded-lg p-3 text-center">
                <div class="text-lg font-bold text-orange-400" x-text="$store.ingest?.statistics?.signalLostChannels || 0" x-cloak></div>
                <div class="text-xs text-gray-300">No Signal</div>
            </div>
            <!-- Auto-stop limit badge (shown only when feature is enabled) -->
            <template x-if="$store.ingest?.autoStop?.enabled">
                <div class="flex-1 bg-gray-800 rounded-lg p-3 text-center">
                    <div class="text-lg font-bold"
                         :class="{
                             'text-red-400 animate-pulse': $store.ingest?.autoStop?.triggered,
                             'text-yellow-400': $store.ingest?.autoStop?.warningSent && !$store.ingest?.autoStop?.triggered,
                             'text-blue-400': !$store.ingest?.autoStop?.warningSent,
                         }"
                         x-text="$store.ingest?.formatLimit($store.ingest?.autoStop?.limitSeconds || 0)" x-cloak></div>
                    <div class="text-xs text-gray-300">Auto-Stop</div>
                </div>
            </template>
        </div>

        <!-- Channel Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <template x-for="channel in $store.ingest?.getChannelsSorted() || []" :key="channel.name">
                <div class="bg-gray-800 rounded-lg p-3 border-l-4"
                     :class="channel.is_recording ? 'border-red-500' : (channel.has_signal ? 'border-gray-500' : 'border-yellow-500')">
                    <!-- Channel Header -->
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-medium text-sm" x-text="channel.name" x-cloak></span>
                        <div class="w-3 h-3 rounded-full"
                             :class="{
                                 'bg-red-500': channel.is_recording && !channel.has_errors,
                                 'bg-yellow-500 animate-pulse': channel.is_recording && channel.has_errors,
                                 'bg-gray-500': !channel.is_recording && channel.has_signal,
                                 'bg-red-800': !channel.has_signal
                             }"></div>
                    </div>
                    
                    <!-- Channel Status -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <span class="text-gray-400">Status:</span>
                            <span :class="channel.is_recording ? 'text-red-400' : 'text-gray-300'"
                                  x-text="channel.is_recording ? 'Recording' : 'Standby'" x-cloak></span>
                        </div>
                        <div class="flex justify-between text-xs">
                            <span class="text-gray-400">Signal:</span>
                            <span :class="channel.has_signal ? 'text-green-400' : 'text-red-400'"
                                  x-text="channel.has_signal ? 'OK' : 'No Signal'" x-cloak></span>
                        </div>
                        <div x-show="channel.is_recording" class="flex justify-between text-xs">
                            <span class="text-gray-400">Time:</span>
                            <span class="text-blue-400 font-mono" 
                                  x-text="`${String(channel.hours || 0).padStart(2, '0')}:${String(channel.minutes || 0).padStart(2, '0')}:${String(channel.seconds || 0).padStart(2, '0')}:${String(channel.frames || 0).padStart(2, '0')}`" x-cloak></span>
                        </div>
                        <div x-show="channel.has_errors" class="text-xs">
                            <div class="text-yellow-400 mb-1">
                            <i data-lucide="triangle-alert" class="inline-block w-3.5 h-3.5"></i> <span x-text="channel.last_errors?.length || 0" x-cloak></span> errors
                            </div>
                            <div x-show="channel.last_error" class="text-yellow-300 text-xs bg-yellow-900/20 p-2 rounded">
                                <div class="font-medium">Latest:</div>
                                <div x-text="channel.last_error?.error_message || 'Unknown error'" class="word-break-words" x-cloak></div>
                                <div x-show="channel.last_error?.timestamp" class="text-gray-400 text-xs mt-1">
                                    <span x-text="channel.last_error?.timestamp ? new Date(channel.last_error.timestamp).toLocaleDateString('da-DK', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : ''" x-cloak></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Recording Destination Paths -->
        <template x-if="$store.ingest?.hasRecordingPaths()">
            <div class="mb-4">
                <button @click="showPaths = !showPaths"
                        class="flex items-center text-xs font-medium text-gray-400 hover:text-gray-200 transition-colors mb-2">
                    <span x-text="showPaths ? '▾' : '▸'" class="mr-1 w-3" x-cloak></span>
                    Recording Destinations
                </button>
                <div x-show="showPaths"
                     x-transition:enter="transition ease-out duration-150"
                     x-transition:enter-start="opacity-0"
                     x-transition:enter-end="opacity-100"
                     x-transition:leave="transition ease-in duration-100"
                     x-transition:leave-start="opacity-100"
                     x-transition:leave-end="opacity-0"
                     class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <template x-for="channel in $store.ingest?.getChannelsSorted() || []" :key="'paths-' + channel.name">
                        <template x-if="$store.ingest?.getRecordingPathsForChannel(channel.name)">
                            <div class="bg-gray-800/60 rounded-lg px-3 py-2 border-l-2 border-blue-500/50">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-medium text-gray-300" x-text="channel.name" x-cloak></span>
                                    <span class="text-xs text-blue-400/70"
                                          x-text="'Preset: ' + ($store.ingest?.getRecordingPathsForChannel(channel.name)?.preset_name || '-')"
                                          x-cloak></span>
                                </div>
                                <template x-for="(path, idx) in ($store.ingest?.getRecordingPathsForChannel(channel.name)?.paths || [])" :key="idx">
                                    <div class="flex items-center text-xs text-gray-400 mt-0.5">
                                        <svg class="w-3 h-3 mr-1 flex-shrink-0 text-blue-400/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                                        </svg>
                                        <span class="font-mono truncate" x-text="path" x-cloak></span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </template>

        <!-- Action Buttons -->
        <div class="flex justify-between items-center">
            <div class="text-xs text-gray-400">
                Last updated: <span x-text="$store.ingest?.lastUpdate ? new Date($store.ingest.lastUpdate).toLocaleTimeString() : 'Never'" x-cloak></span>
            </div>
            <div class="flex space-x-2">
                <!-- Start All Channels Button -->
                <button @click="$store.ingest?.startAllChannels()"
                        :disabled="($store.ingest?.getChannelsSorted() || []).length === 0"
                        :class="($store.ingest?.getChannelsSorted() || []).length > 0 ? 'bg-green-600 hover:bg-green-700' : 'bg-gray-600 cursor-not-allowed'"
                        class="text-white px-3 py-1 rounded text-xs transition-colors duration-200">
                    <span x-show="!$store.ingest?.isStarting"><i data-lucide="play" class="inline-block w-3.5 h-3.5"></i> Start All</span>
                    <span x-show="$store.ingest?.isStarting"><i data-lucide="loader" class="inline-block w-3.5 h-3.5 animate-spin"></i> Starting...</span>
                </button>
                
                <!-- Stop All Channels Button -->
                <button @click="$store.ingest?.stopAllChannels()"
                        :disabled="($store.ingest?.getChannelsSorted() || []).length === 0"
                        :class="($store.ingest?.getChannelsSorted() || []).length > 0 ? 'bg-red-600 hover:bg-red-700' : 'bg-gray-600 cursor-not-allowed'"
                        class="text-white px-3 py-1 rounded text-xs transition-colors duration-200">
                    <span x-show="!$store.ingest?.isStopping"><i data-lucide="square" class="inline-block w-3.5 h-3.5"></i> Stop All</span>
                    <span x-show="$store.ingest?.isStopping"><i data-lucide="loader" class="inline-block w-3.5 h-3.5 animate-spin"></i> Stopping...</span>
                </button>
                
                <!-- Clear All Errors Button -->
                <button @click="$store.ingest?.clearAllErrors()"
                        :disabled="($store.ingest?.statistics?.errorChannels || 0) === 0"
                        :class="($store.ingest?.statistics?.errorChannels || 0) > 0 ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-gray-600 cursor-not-allowed'"
                        class="text-white px-3 py-1 rounded text-xs transition-colors duration-200">
                    <span x-show="!$store.ingest?.isClearing"><i data-lucide="trash-2" class="inline-block w-3.5 h-3.5"></i> Clear Errors</span>
                    <span x-show="$store.ingest?.isClearing"><i data-lucide="loader" class="inline-block w-3.5 h-3.5 animate-spin"></i> Clearing...</span>
                </button>
                
                <!-- Refresh Button -->
                <button @click="$store.ingest?.loadInitialData()"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs transition-colors duration-200">
                    <i data-lucide="refresh-cw" class="inline-block w-3.5 h-3.5"></i> Refresh
                </button>
            </div>
        </div>
    </div>
</div>
