<!-- Audio Recording Status Bar Component -->
<div x-data="{
        segs: [
            { t: 0.003, on: 'bg-green-500' },
            { t: 0.005, on: 'bg-green-500' },
            { t: 0.008, on: 'bg-green-500' },
            { t: 0.015, on: 'bg-green-500' },
            { t: 0.03,  on: 'bg-green-500' },
            { t: 0.06,  on: 'bg-green-500' },
            { t: 0.10,  on: 'bg-green-500' },
            { t: 0.18,  on: 'bg-green-500' },
            { t: 0.30,  on: 'bg-green-500' },
            { t: 0.40,  on: 'bg-yellow-500' },
            { t: 0.50,  on: 'bg-yellow-500' },
            { t: 0.60,  on: 'bg-yellow-500' },
            { t: 0.75,  on: 'bg-orange-500' },
            { t: 0.82,  on: 'bg-orange-500' },
            { t: 0.90,  on: 'bg-red-500' },
            { t: 0.95,  on: 'bg-red-600 brightness-125' },
        ]
     }"
     x-cloak
     x-show="$store.audio?.enabled"
     class="bg-gray-700/60 rounded-lg p-3">
    <!-- Top row: status + overflow badge -->
    <div class="flex items-center justify-between">
        <!-- Left: Status indicator -->
        <div class="flex items-center gap-2">
            <i data-lucide="mic" class="w-4 h-4 text-gray-300"></i>
            <span class="text-sm font-medium text-gray-300">Audio:</span>

            <!-- Recording state -->
            <template x-if="$store.audio?.recording">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                    </span>
                    <span class="text-sm text-red-400 font-medium">REC</span>
                    <span class="text-xs text-gray-400">
                        <span x-text="$store.audio.trackCount"></span> tracks
                        @ <span x-text="($store.audio.samplerate / 1000).toFixed(1)"></span>kHz
                    </span>
                </div>
            </template>

            <!-- Idle state -->
            <template x-if="!$store.audio?.recording && !$store.audio?.deviceDisconnected && !$store.audio?.lastError">
                <span class="text-sm text-gray-500">Standby</span>
            </template>

            <!-- Device disconnected -->
            <template x-if="$store.audio?.deviceDisconnected">
                <div class="flex items-center gap-1">
                    <i data-lucide="unplug" class="w-3.5 h-3.5 text-yellow-400"></i>
                    <span class="text-sm text-yellow-400">Device disconnected</span>
                </div>
            </template>

            <!-- Error (non-device) -->
            <template x-if="!$store.audio?.deviceDisconnected && $store.audio?.lastError && !$store.audio?.recording">
                <div class="flex items-center gap-1">
                    <i data-lucide="triangle-alert" class="w-3.5 h-3.5 text-red-400"></i>
                    <span class="text-sm text-red-400 truncate max-w-xs" x-text="$store.audio.lastError"></span>
                </div>
            </template>
        </div>

        <!-- Right: Overflow warning badge -->
        <div x-show="$store.audio?.recording && $store.audio?.overflowCount > 0"
             class="flex items-center gap-1 text-xs text-yellow-400">
            <i data-lucide="triangle-alert" class="w-3.5 h-3.5"></i>
            <span x-text="$store.audio.overflowCount + ' overflow(s)'"></span>
        </div>
    </div>

    <!-- VU Meters: vertical bars, bottom-to-top, evenly spaced -->
    <div x-show="$store.audio?.levelTracks.length > 0"
         class="mt-2 flex justify-evenly">
        <template x-for="track in $store.audio.levelTracks" :key="track.label">
            <div class="flex gap-px">
                <!-- Vertical label (top-to-bottom) -->
                <span class="text-[7px] text-gray-500 leading-[1]"
                      style="writing-mode: vertical-rl; text-orientation: mixed;"
                      x-text="track.label"></span>
                <!-- Mono: single vertical bar -->
                <template x-if="track.peaks.length === 1">
                    <div class="flex flex-col-reverse gap-px">
                        <template x-for="seg in segs" :key="seg.t">
                            <div class="w-2 h-1 rounded-[1px]"
                                 :class="track.peaks[0] > seg.t ? seg.on : 'bg-gray-600'"></div>
                        </template>
                    </div>
                </template>
                <!-- Stereo: L + R side by side, vertical -->
                <template x-if="track.peaks.length > 1">
                    <div class="flex gap-px">
                        <div class="flex flex-col-reverse gap-px">
                            <template x-for="seg in segs" :key="seg.t">
                                <div class="w-1.5 h-1 rounded-[1px]"
                                     :class="track.peaks[0] > seg.t ? seg.on : 'bg-gray-600'"></div>
                            </template>
                        </div>
                        <div class="flex flex-col-reverse gap-px">
                            <template x-for="seg in segs" :key="seg.t">
                                <div class="w-1.5 h-1 rounded-[1px]"
                                     :class="track.peaks[1] > seg.t ? seg.on : 'bg-gray-600'"></div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
