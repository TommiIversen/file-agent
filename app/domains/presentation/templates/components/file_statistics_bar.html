<!-- File Statistics Bar Component -->
<div class="flex justify-center">
    <div class="flex items-center gap-1 text-xs bg-gray-700 bg-opacity-40 rounded-lg px-2 py-1 whitespace-nowrap">
        <button @click="$store.files.setFilter('all')"
                :class="{'bg-blue-700': $store.files.activeFilter === 'all'}"
                class="flex items-center gap-1 px-2 py-1 rounded-md hover:bg-blue-600 focus:outline-none transition-colors duration-200">
            <span class="text-blue-300">Total</span>
            <strong class="text-white" x-text="$store.files.statistics.totalFiles" x-cloak>0</strong>
        </button>
        <button @click="$store.files.setFilter('active')"
                :class="{'bg-yellow-700': $store.files.activeFilter === 'active'}"
                class="flex items-center gap-1 px-2 py-1 rounded-md hover:bg-yellow-600 focus:outline-none transition-colors duration-200">
            <span class="text-yellow-300">Aktive</span>
            <strong class="text-white" x-text="$store.files.statistics.activeFiles" x-cloak>0</strong>
        </button>
        <button @click="$store.files.setFilter('growing')"
                :class="{'bg-orange-700': $store.files.activeFilter === 'growing'}"
                class="flex items-center gap-1 px-2 py-1 rounded-md hover:bg-orange-600 focus:outline-none transition-colors duration-200">
            <span class="text-orange-300">Growing</span>
            <strong class="text-white" x-text="$store.files.statistics.growingFiles" x-cloak>0</strong>
        </button>
        <button @click="$store.files.setFilter('completed')"
                :class="{'bg-green-700': $store.files.activeFilter === 'completed'}"
                class="flex items-center gap-1 px-2 py-1 rounded-md hover:bg-green-600 focus:outline-none transition-colors duration-200">
            <span class="text-green-300">Færdige</span>
            <strong class="text-white" x-text="$store.files.statistics.completedFiles" x-cloak>0</strong>
        </button>
        <button @click="$store.files.setFilter('failed')"
                :class="{'bg-red-700': $store.files.activeFilter === 'failed'}"
                class="flex items-center gap-1 px-2 py-1 rounded-md hover:bg-red-600 focus:outline-none transition-colors duration-200">
            <span class="text-red-300">Fejlede</span>
            <strong class="text-white" x-text="$store.files.statistics.failedFiles" x-cloak>0</strong>
        </button>
    </div>
</div>
