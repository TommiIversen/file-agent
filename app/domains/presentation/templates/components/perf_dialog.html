<!-- Performance Dialog -->
<div x-show="$store.perf.isOpen"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex backdrop-blur-sm items-center justify-center z-50"
     @click.self="$store.perf.closeDialog()"
     @keydown.escape.window="$store.perf.closeDialog()"
     x-cloak>

    <div class="bg-gray-800 rounded-lg shadow-xl p-6 m-4 max-w-4xl w-full max-h-[85vh] overflow-hidden flex flex-col"
         @click.stop>

        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-white flex items-center">
                <span x-html="UIHelpers.icon('activity', 'inline-block w-6 h-6 mr-2')"></span> System Performance
            </h2>
            <div class="flex items-center space-x-3">
                <span class="text-gray-400 text-sm"
                      x-text="`Last ${Math.round($store.perf.history.length * 10 / 60)} min · ${$store.perf.history.length} samples`">
                </span>
                <button @click="$store.perf.closeDialog()"
                        class="text-gray-400 hover:text-white text-2xl leading-none transition-colors duration-200">
                    &times;
                </button>
            </div>
        </div>

        <!-- Current values summary -->
        <div class="bg-gray-900 bg-opacity-60 rounded-lg p-3 mb-4">
            <div class="flex flex-wrap gap-3 items-center">
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium bg-blue-900/40 text-blue-300">
                    CPU <strong x-text="`${($store.perf.system.cpu || 0).toFixed(0)}%`"></strong>
                </span>
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium bg-purple-900/40 text-purple-300">
                    MEM <strong x-text="`${($store.perf.system.mem || 0).toFixed(0)}%`"></strong>
                </span>
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium bg-yellow-900/40 text-yellow-300">
                    DISK <strong x-text="`${($store.perf.system.disk || 0).toFixed(0)}%`"></strong>
                </span>
                <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium bg-green-900/40 text-green-300">
                    NET ↓<strong x-text="`${($store.perf.system.net_rx || 0).toFixed(1)}`"></strong>
                    ↑<strong x-text="`${($store.perf.system.net_tx || 0).toFixed(1)} Mbps`"></strong>
                </span>
            </div>
        </div>

        <!-- Charts grid -->
        <div class="flex-1 overflow-y-auto">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                <!-- CPU / Memory / Disk line chart -->
                <div class="lg:col-span-2">
                    <h3 class="text-sm font-medium text-gray-300 mb-2">CPU / Memory / Disk</h3>
                    <div class="h-48 bg-gray-900/30 rounded-lg p-2">
                        <canvas id="perf-cpu-chart"></canvas>
                    </div>
                </div>

                <!-- Per-core bar chart -->
                <div>
                    <h3 class="text-sm font-medium text-gray-300 mb-2">CPU Per Core</h3>
                    <div class="h-48 bg-gray-900/30 rounded-lg p-2">
                        <canvas id="perf-cores-chart"></canvas>
                    </div>
                </div>

                <!-- Network I/O line chart -->
                <div>
                    <h3 class="text-sm font-medium text-gray-300 mb-2">Network I/O</h3>
                    <div class="h-48 bg-gray-900/30 rounded-lg p-2">
                        <canvas id="perf-net-chart"></canvas>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
