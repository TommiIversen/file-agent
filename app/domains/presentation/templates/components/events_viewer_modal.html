<!-- Events Viewer Modal -->
<div x-show="$store.eventsViewer.isOpen"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 flex backdrop-blur-sm items-center justify-center z-50"
     @click.self="$store.eventsViewer.closeModal()"
     @keydown.escape.window="$store.eventsViewer.closeModal()"
     x-cloak>

    <div class="bg-gray-800 rounded-lg shadow-xl p-6 m-4 max-w-[95vw] w-full h-[89vh] overflow-hidden flex flex-col"
         @click.stop>
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-white flex items-center">
                <i data-lucide="activity" class="inline-block w-6 h-6 mr-2"></i> System Events
            </h2>
            <div class="flex items-center space-x-3">
                <button @click="$store.eventsViewer.refresh()"
                        class="text-gray-400 hover:text-white text-sm px-3 py-1 bg-gray-700 rounded transition-colors duration-200"
                        :disabled="$store.eventsViewer.isLoading">
                    <i data-lucide="refresh-cw" class="inline-block w-3.5 h-3.5"></i> Refresh
                </button>
                <button @click="$store.eventsViewer.closeModal()"
                        class="text-gray-400 hover:text-white text-2xl leading-none transition-colors duration-200">
                    ×
                </button>
            </div>
        </div>

        <!-- Filters + Date Picker + Stats -->
        <div class="bg-gray-900 bg-opacity-60 rounded-lg p-3 mb-4">
            <div class="flex flex-wrap gap-4 items-center">
                <!-- Level Filter -->
                <div class="flex items-center space-x-2">
                    <label class="text-gray-300 text-sm">Level:</label>
                    <div class="flex space-x-1">
                        <button @click="$store.eventsViewer.setLevelFilter('all')"
                                class="px-3 py-1 rounded text-xs transition-colors duration-200"
                                :class="$store.eventsViewer.levelFilter === 'all' ? 'bg-purple-600 text-white' : 'bg-gray-600 text-gray-300 hover:bg-gray-500'">
                            All
                        </button>
                        <button @click="$store.eventsViewer.setLevelFilter('error')"
                                class="px-3 py-1 rounded text-xs transition-colors duration-200"
                                :class="$store.eventsViewer.levelFilter === 'error' ? 'bg-red-600 text-white' : 'bg-gray-600 text-gray-300 hover:bg-gray-500'">
                            Error
                        </button>
                        <button @click="$store.eventsViewer.setLevelFilter('warning')"
                                class="px-3 py-1 rounded text-xs transition-colors duration-200"
                                :class="$store.eventsViewer.levelFilter === 'warning' ? 'bg-yellow-600 text-white' : 'bg-gray-600 text-gray-300 hover:bg-gray-500'">
                            Warning
                        </button>
                        <button @click="$store.eventsViewer.setLevelFilter('info')"
                                class="px-3 py-1 rounded text-xs transition-colors duration-200"
                                :class="$store.eventsViewer.levelFilter === 'info' ? 'bg-blue-600 text-white' : 'bg-gray-600 text-gray-300 hover:bg-gray-500'">
                            Info
                        </button>
                    </div>
                </div>
                
                <!-- Event Type Filter -->
                <div class="flex items-center space-x-2">
                    <label class="text-gray-300 text-sm">Type:</label>
                    <select x-model="$store.eventsViewer.eventTypeFilter"
                            @change="$store.eventsViewer.setEventTypeFilter($event.target.value)"
                            class="bg-gray-600 text-white text-sm rounded px-3 py-1 border border-gray-500">
                        <option value="all">All Types</option>
                        <template x-for="eventType in $store.eventsViewer.availableEventTypes" :key="eventType">
                            <option :value="eventType" x-text="eventType"></option>
                        </template>
                    </select>
                </div>

                <!-- Stats (inline) -->
                <div class="flex items-center space-x-3 text-sm">
                    <span class="text-gray-400"><span class="text-white font-bold" x-text="$store.eventsViewer.computedStats.total_events">0</span> loaded</span>
                    <span class="text-gray-400"><span class="text-red-400 font-bold" x-text="$store.eventsViewer.computedStats.error_count">0</span> errors</span>
                    <span class="text-gray-400"><span class="text-yellow-400 font-bold" x-text="$store.eventsViewer.computedStats.warning_count">0</span> warnings</span>
                </div>

                <!-- Date Picker -->
                <div class="flex items-center space-x-2 ml-auto">
                    <label class="text-gray-300 text-sm">Date:</label>
                    <input type="date"
                           x-model="$store.eventsViewer.selectedDate"
                           @change="$store.eventsViewer.jumpToDate()"
                           class="bg-gray-600 text-white text-sm rounded px-3 py-1 border border-gray-500">
                    <button x-show="$store.eventsViewer.selectedDate"
                            @click="$store.eventsViewer.clearDate()"
                            class="text-gray-400 hover:text-white text-xs px-2 py-1 bg-gray-700 rounded">
                        ✕
                    </button>
                    <button @click="$store.eventsViewer.downloadDay()"
                            class="text-gray-400 hover:text-white text-xs px-3 py-1 bg-gray-700 rounded transition-colors duration-200"
                            :title="$store.eventsViewer.selectedDate ? 'Download events for ' + $store.eventsViewer.selectedDate : 'Download today\'s events'">
                        <i data-lucide="download" class="inline-block w-3.5 h-3.5"></i> CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- Content Area with infinite scroll -->
        <div class="flex-1 min-h-0 bg-gray-900 bg-opacity-60 rounded-lg overflow-hidden">
            <!-- Loading State -->
            <div x-show="$store.eventsViewer.isLoading" 
                 class="flex items-center justify-center h-full text-gray-400 p-4">
                <div class="text-center">
                    <div class="mb-4"><i data-lucide="refresh-cw" class="inline-block w-10 h-10 animate-spin"></i></div>
                    <div>Loading events...</div>
                </div>
            </div>

            <!-- Error State -->
            <div x-show="$store.eventsViewer.error" 
                 class="p-4 bg-red-900 bg-opacity-50 border border-red-600 m-4 rounded">
                <div class="flex items-center text-red-200">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                    </svg>
                    <span x-text="$store.eventsViewer.error"></span>
                </div>
            </div>

            <!-- Events List (infinite scroll) -->
            <div x-show="!$store.eventsViewer.isLoading && !$store.eventsViewer.error" 
                 class="h-full overflow-y-auto p-4"
                 @scroll="$store.eventsViewer.handleScroll($event)">
                
                <!-- Empty State -->
                <div x-show="$store.eventsViewer.filteredEvents.length === 0" 
                     class="flex items-center justify-center h-full text-gray-400">
                    <div class="text-center">
                        <div class="mb-4"><i data-lucide="activity" class="inline-block w-12 h-12 text-gray-500"></i></div>
                        <div>No events found</div>
                    </div>
                </div>

                <!-- Events Table -->
                <div x-show="$store.eventsViewer.filteredEvents.length > 0" 
                     class="divide-y divide-gray-600">
                    
                    <!-- Table Header -->
                    <div class="bg-gray-700 p-3 flex gap-4 text-xs font-semibold text-gray-300 sticky top-0 z-10">
                        <div class="w-32">Time</div>
                        <div class="w-16">Level</div>
                        <div class="w-32">Type</div>
                        <div class="flex-1">Details</div>
                    </div>

                    <!-- Events Rows -->
                    <template x-for="event in $store.eventsViewer.filteredEvents" :key="event.id || event.timestamp">
                        <div class="bg-gray-800 hover:bg-gray-750 p-3 flex gap-4 text-sm border-b border-gray-600 items-center min-h-12">
                            <div class="w-32 text-gray-300 text-xs truncate" x-text="$store.eventsViewer.formatTimestamp(event.timestamp)"></div>
                            <div class="w-16">
                                <span class="px-2 py-1 rounded text-xs font-bold"
                                      :class="$store.eventsViewer.getLevelBadgeColor(event.level)"
                                      x-text="event.level"></span>
                            </div>
                            <div class="w-32 text-white text-xs truncate" x-text="event.event_type"></div>
                            <div class="flex-1 text-gray-300 text-xs" 
                                 x-text="event.details ? Object.entries(event.details).map(([k,v]) => `${k}: ${v}`).join(' | ') : 'No details'"></div>
                        </div>
                    </template>

                    <!-- Loading more indicator -->
                    <div x-show="$store.eventsViewer.isLoadingMore" class="p-4 text-center text-gray-400 text-sm">
                        <span class="animate-pulse">Loading more events...</span>
                    </div>

                    <!-- End of list -->
                    <div x-show="!$store.eventsViewer.hasMore && $store.eventsViewer.filteredEvents.length > 0" 
                         class="p-4 text-center text-gray-500 text-xs">
                        No more events
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
