<!-- Files List Component -->
<div class="h-full overflow-y-auto space-y-0" @scroll="$store.files.handleFilesScroll($event)">

    <template x-for="file in $store.files.filteredFiles" :key="file.id">
        <!-- Simple File Row with Click-Toggle Tooltip -->
        <div class="bg-gray-800 hover:bg-gray-900 rounded px-2.5 py-0.5 mb-px shadow"
             x-data="{ showTip: false }">
            <div class="flex items-center space-x-2">

                <!-- File Type Icon + File Name (left) -->
                <div class="flex-1 min-w-0 flex items-center gap-1.5">
                    <span class="flex-shrink-0 w-3.5 h-3.5" x-html="UIHelpers.getFileTypeIconSvg(file.file_path)"></span>
                    <div class="text-white text-sm font-medium truncate" x-text="UIHelpers.getFileName(file.file_path)"></div>
                </div>

                <!-- Progress Bar (center, fixed smaller width) -->
                <div class="w-[28%] shrink-0 ml-[1%]">
                    <div class="w-full bg-gray-700 rounded overflow-hidden">
                        <div class="py-0.5 text-[11px] leading-tight text-center rounded text-white transition-all duration-500 ease-out"
                             :style="UIHelpers.getProgressWidth(file)"
                             :class="UIHelpers.getProgressColor(file)"
                             x-text="UIHelpers.getProgressText(file)">
                        </div>
                    </div>
                </div>

                <!-- Right side info (fixed-width grid columns to prevent jumping) -->
                <div class="flex-1 grid grid-cols-3 items-center min-w-0">
                    <!-- Status -->
                    <div class="w-32 text-center">
                        <div class="inline-block py-0.5 px-1.5 rounded-full text-[11px] font-semibold"
                             :class="UIHelpers.getStatusBadgeColor(file.status)"
                             x-text="UIHelpers.getFriendlyStatus(file.status)">
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="w-32 text-center text-[11px]">
                        <div class="text-white"
                             x-text="UIHelpers.formatCustomDateTime(file.discovered_at)"></div>
                    </div>

                    <!-- Bytes Copied -->
                    <div class="w-32 text-right text-[11px]">
                        <div x-show="file.bytes_copied && file.file_size" class="text-green-300">
                            <span x-text="UIHelpers.formatBytesCopied(file.bytes_copied, file.file_size)"></span>
                        </div>
                    </div>
                </div>

                <!-- Info toggle button -->
                <button class="ml-1 p-1 rounded-full transition-colors duration-200 flex-shrink-0"
                        :class="showTip ? 'text-blue-400 bg-gray-700' : 'text-gray-500 hover:text-gray-300'"
                        @click.stop="showTip = !showTip"
                        title="Vis detaljer">
                    <i data-lucide="info" class="w-3.5 h-3.5 pointer-events-none"></i>
                </button>
            </div>

            <!-- Expandable Detail Panel -->
            <div x-show="showTip"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 -translate-y-1"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 translate-y-0"
                 x-transition:leave-end="opacity-0 -translate-y-1"
                 class="mt-2 bg-gray-900 rounded-lg p-4 border border-gray-700">
                <div class="grid grid-cols-2 gap-6 text-sm">
                    <!-- Left Column -->
                    <div class="space-y-2">
                        <div>
                            <span class="text-gray-400">Source:</span>
                            <div class="text-white text-xs break-all" x-text="file.file_path"></div>
                        </div>
                        <div x-show="file.destination_path">
                            <span class="text-gray-400">Destination:</span>
                            <div class="text-green-300 text-xs break-all" x-text="file.destination_path"></div>
                        </div>
                        <div>
                            <span class="text-gray-400">Discovered:</span>
                            <div class="text-white" x-text="UIHelpers.formatDateTime(file.discovered_at)"></div>
                        </div>
                        <div x-show="file.started_copying_at">
                            <span class="text-gray-400">Started:</span>
                            <div class="text-green-300"
                                 x-text="UIHelpers.formatDateTime(file.started_copying_at)"></div>
                        </div>
                        <div x-show="file.completed_at">
                            <span class="text-gray-400">Completed:</span>
                            <div class="text-blue-300" x-text="UIHelpers.formatDateTime(file.completed_at)"></div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="space-y-2">
                        <div>
                            <span class="text-gray-400">File Size:</span>
                            <div class="text-white" x-text="UIHelpers.formatFileSizeMB(file.file_size_mb)"></div>
                        </div>
                        <div>
                            <span class="text-gray-400">Retry Count:</span>
                            <div class="text-white font-bold" x-text="file.retry_count"></div>
                        </div>
                        <div x-show="UIHelpers.isGrowingFile(file)">
                            <span class="text-gray-400">Growing File:</span>
                            <div class="text-orange-300">
                                <span x-text="UIHelpers.getGrowingFileIcon(file)"></span>
                                Yes
                            </div>
                        </div>
                        <div x-show="file.copy_speed_mbps && file.copy_speed_mbps > 0">
                            <span class="text-gray-400">Copy Speed:</span>
                            <div class="text-blue-300"
                                 x-text="(file.copy_speed_mbps || 0).toFixed(1) + ' MB/s'"></div>
                        </div>
                        <div x-show="file.bytes_copied">
                            <span class="text-gray-400">Progress:</span>
                            <div class="text-green-300"
                                 x-text="UIHelpers.formatBytesCopied(file.bytes_copied, file.file_size)"></div>
                        </div>
                    </div>
                </div>

                <!-- Arrow pointing down -->
                <div class="absolute top-full left-8 w-0 h-0 border-l-8 border-r-8 border-t-8 border-l-transparent border-r-transparent border-t-gray-900"></div>
            </div>

            <!-- Error Message -->
            <div x-show="file.error_message"
                 class="mt-2 p-2 bg-red-900 bg-opacity-50 rounded border border-red-600">
                <div class="flex items-center">
                    <svg class="w-4 h-4 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                              clip-rule="evenodd"></path>
                    </svg>
                    <span class="text-red-200 text-xs" x-text="file.error_message"></span>
                </div>
            </div>
        </div>
    </template>

    <!-- Empty State -->
    <div x-show="$store.files.filteredFiles.length === 0" class="text-center">
        <div class="text-gray-300 text-lg bg-gray-800 bg-opacity-60 rounded-lg p-8">
            <div class="mb-4"><i data-lucide="folder" class="inline-block w-12 h-12 text-gray-500"></i></div>
            Ingen filer fundet
        </div>
    </div>

    <!-- Loading more indicator -->
    <div x-show="$store.files.isLoadingMore" class="p-4 text-center text-gray-400 text-sm">
        <span class="animate-pulse">Henter flere filer...</span>
    </div>

    <!-- End of list -->
    <div x-show="!$store.files.hasMore && $store.files.filteredFiles.length > 0"
         class="p-3 text-center text-gray-500 text-xs">
        Ingen flere filer
    </div>
</div>
