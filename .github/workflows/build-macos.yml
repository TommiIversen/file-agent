# Build & Release: macOS standalone binary
#
# Trigger: Push a tag matching v*.*.* (e.g. v1.0.0, v2.3.1-beta)
#
# Flow:
#   1. Tag triggers workflow
#   2. Builds PyInstaller binary on macOS (arm64 — Apple Silicon)
#   3. Packages as .tar.gz
#   4. Creates GitHub Release with the artifact attached
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0

name: Build macOS Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # Needed to create releases

jobs:
  build:
    name: Build macOS binary
    runs-on: macos-14   # Apple Silicon (M1/M2) runner

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Clean PyInstaller cache
        run: |
          rm -rf build/ dist/ __pycache__/
          pyinstaller --clean --noconfirm file-agent.spec 2>/dev/null || true

      - name: Write build timestamp
        run: |
          TZ=Europe/Copenhagen date '+%Y-%m-%d %H:%M:%S' > BUILD_TIME

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm file-agent.spec
          echo "Build complete. Contents of dist/file-agent/:"
          ls -la dist/file-agent/

      - name: Package artifact
        run: |
          cd dist
          tar -czf file-agent-${{ steps.version.outputs.VERSION }}-macos-arm64.tar.gz file-agent/
          ls -la *.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "File Agent ${{ steps.version.outputs.VERSION }}"
          body: |
            ## File Agent ${{ steps.version.outputs.VERSION }}

            ### Installation (one command)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### Manual download
            Download `file-agent-${{ steps.version.outputs.VERSION }}-macos-arm64.tar.gz`, extract, and run:
            ```bash
            tar xzf file-agent-*.tar.gz
            cd file-agent
            ./file-agent
            ```

            ### Upgrade existing installation
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash -s -- --upgrade
            ```
          files: |
            dist/file-agent-${{ steps.version.outputs.VERSION }}-macos-arm64.tar.gz
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
